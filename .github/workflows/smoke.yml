name: Smoke

on:
  push:
    branches:
      - main
  pull_request: null

jobs:
  smoke:
    strategy:
      matrix:
        os:
          - macos
          - ubuntu
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build --impure
        env:
          NIXPKGS_ALLOW_UNFREE: 1
      - run: result/bin/code --version
